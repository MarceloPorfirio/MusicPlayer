# Para testar a imagem localmente: docker compose up --build → http://localhost:3000
# Em produção quem sobe o container é o Coolify, a partir da imagem do GHCR
# (ver "Deploy na VPS" no README). HTTPS e domínio ficam com o Traefik dele.
services:
  musicplayer:
    build: .
    container_name: musicplayer-local
    env_file:
      - path: .env
        required: false
    environment:
      TRUST_PROXY: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
